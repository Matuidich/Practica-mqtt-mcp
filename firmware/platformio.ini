; Compilar no carga firmware. Para una carga manual seleccionar siempre un entorno.
[platformio]
default_envs = integrated

[env]
platform = platformio/espressif32@8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:integrated]
; Una placa: HC-SR04 y tres LEDs, con una sola sesión MQTT.
build_src_filter = -<*> +<integrated/main.cpp>
lib_deps = knolleary/PubSubClient@2.8

[env:sensor]
build_src_filter = -<*> +<sensor/main.cpp>
lib_deps = knolleary/PubSubClient@2.8

[env:actuator]
build_src_filter = -<*> +<actuator/main.cpp>
lib_deps = knolleary/PubSubClient@2.8

[env:esp32dev]
; Esqueleto anterior conservado para compatibilidad, no es el firmware distribuido.
build_src_filter = -<*> +<main.cpp>

[env:hardware-diagnostic]
; Punto de entrada separado: nunca enlazar dos setup()/loop().
build_src_filter = -<*> +<diagnostics/main.cpp>
lib_deps = madhephaestus/ESP32Servo@3.2.1

[env:led_test]
; Prueba independiente de GPIO 25/26/27: sin Wi-Fi, MQTT ni configuracion local.
build_src_filter = -<*> +<led_test/main.cpp>
